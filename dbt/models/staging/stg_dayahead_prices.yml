version: 2

models:
  - name: stg_dayahead_prices
    description: "Hourly day-ahead prices per bidding zone (long format). Key: timestamp_utc + bidding_zone."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - timestamp_utc
              - bidding_zone
    columns:
      - name: timestamp_utc
        tests:
          - not_null
      - name: bidding_zone
        tests:
          - not_null
      - name: price_eur_mwh
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -500
                max_value: 5000
      - name: date_local
        tests:
          - not_null
      - name: hour_local
        tests:
          - not_null